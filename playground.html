<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kria Playground — Interactive web-based Kria interpreter.">
  <title>Playground — Kria</title>
  <link rel="icon" href="assets/kria-ico.png" type="image/png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    body[data-page="playground"] #main-content {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 0;
      gap: 0;
    }

    .playground-toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0;
      background-color: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border);
      gap: 0;
    }

    .playground-toolbar-left {
      display: flex;
      align-items: flex-end;
      gap: 0;
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 0.5rem 0 1.5rem;
    }

    .file-item {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background-color: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
      transition: all 0.2s;
      margin-top: 0.5rem;
      border-right: none;
      user-select: none;
    }

    .file-item:hover:not(.active) {
      background-color: var(--color-bg);
    }

    .file-item.active {
      background-color: var(--color-bg);
      border-color: var(--color-border);
      border-bottom: 2px solid var(--color-primary, #2563eb);
      font-weight: 500;
    }

    .file-item .close-btn {
      margin-left: 0.25rem;
      cursor: pointer;
      opacity: 0.7;
      font-weight: bold;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      line-height: 1;
      user-select: none;
    }

    .file-item .close-btn:hover {
      opacity: 1;
      background-color: rgba(0, 0, 0, 0.1);
      border-radius: 3px;
    }

    .add-file-btn {
      width: 36px;
      height: 36px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-bg-secondary);
      border: 1px solid var(--color-border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      font-size: 1.3rem;
      transition: all 0.2s;
      margin-top: 0.5rem;
      user-select: none;
    }

    .add-file-btn:hover {
      background-color: var(--color-bg);
    }

    .run-button {
      padding: 0.75rem 1.5rem;
      background-color: var(--color-primary, #2563eb);
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
      margin: 0.5rem;
      white-space: nowrap;
      flex-shrink: 0;
      user-select: none;
    }

    .run-button:hover {
      background-color: var(--color-primary-hover, #1d4ed8);
    }

    .run-button:active {
      transform: scale(0.98);
    }

    .playground-container {
      display: flex;
      flex: 1;
      gap: 0.75rem;
      padding: 0.75rem;
      padding-top: 0;
      min-height: 0;
    }

    .editor-pane {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      overflow: hidden;
    }

    .editor-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .line-numbers {
      background-color: var(--color-bg-secondary);
      color: var(--color-text-muted);
      padding: 1rem 0.75rem;
      text-align: right;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      border-right: 1px solid var(--color-border);
      user-select: none;
      overflow: hidden;
      min-width: 3.5rem;
      flex-shrink: 0;
      white-space: pre;
    }

    .editor-textarea {
      flex: 1;
      padding: 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      border: none;
      outline: none;
      background-color: var(--color-bg);
      color: var(--color-text);
      resize: none;
      overflow-y: auto;
      overflow-x: auto;
      tab-size: 2;
      white-space: pre;
    }

    .output-pane {
      flex: 0.8;
      display: flex;
      flex-direction: column;
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      overflow: hidden;
    }

    .output-header {
      padding: 0.75rem 1rem;
      background-color: var(--color-bg-secondary);
      border-bottom: 1px solid var(--color-border);
      font-weight: 500;
      color: var(--color-text);
    }

    .output-content {
      flex: 1;
      padding: 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      line-height: 1.5;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--color-text);
    }

    .output-content.empty {
      color: var(--color-text-muted);
    }

    @media (max-width: 768px) {
      .playground-container {
        flex-direction: column;
      }

      .playground-toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .playground-toolbar-left {
        flex-wrap: wrap;
      }

      .run-button {
        width: 100%;
        margin: 0.5rem 0;
      }
    }
  </style>
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
</head>
<body data-page="playground">
  <main id="main-content">
    <div class="playground-toolbar">
      <div class="playground-toolbar-left" id="file-tabs"></div>
      <button class="run-button" id="run-button">▶ Run</button>
    </div>

    <div class="playground-container">
      <div class="editor-pane">
        <div class="editor-wrapper">
          <div class="line-numbers" id="line-numbers"></div>
          <textarea class="editor-textarea" id="code-editor" spellcheck="false"></textarea>
        </div>
      </div>

      <div class="output-pane">
        <div class="output-header">Output</div>
        <div class="output-content empty" id="output">Run your code to see output...</div>
      </div>
    </div>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/main.js"></script>
  <script>
    // File management
    const files = {
      'main.krx': `fn greet(name) {
    return "Hello, " + name
}

set message = greet("Kria")
print(message)`,
      'example1.krx': `# Example: Counter
set counter = 0
set max = 5

loop {
    print(counter)
    set counter = counter + 1
    if counter >= max {
        break
    }
}`,
      'example2.krx': `# Example: Array Operations
set numbers = [1, 2, 3, 4, 5]
set doubled = []

for num in numbers {
    set doubled = doubled + [num * 2]
}

print(doubled)`
    };

    let currentFile = 'main.krx';
    let customFileCount = 0;

    const editor = document.getElementById('code-editor');
    const fileTabs = document.getElementById('file-tabs');
    const runButton = document.getElementById('run-button');
    const output = document.getElementById('output');
    const lineNumbers = document.getElementById('line-numbers');

    // Initialize
    loadFile('main.krx');
    renderTabs();

    // Update line numbers when editor content changes
    editor.addEventListener('input', updateLineNumbers);
    editor.addEventListener('scroll', syncLineNumbersScroll);

    function updateLineNumbers() {
      const lines = editor.value.split('\n');
      let lineNumbersText = '';
      for (let i = 1; i <= lines.length; i++) {
        lineNumbersText += i + '\n';
      }
      // Remove last newline for proper alignment
      lineNumbers.textContent = lineNumbersText.trim() + '\n';
    }

    function syncLineNumbersScroll() {
      lineNumbers.scrollTop = editor.scrollTop;
    }

    function renderTabs() {
      fileTabs.innerHTML = '';
      
      // Render existing files
      Object.keys(files).forEach(fileName => {
        const tab = document.createElement('div');
        tab.className = `file-item ${fileName === currentFile ? 'active' : ''}`;
        tab.innerHTML = `
          ${fileName}
          <span class="close-btn" onclick="closeFile('${fileName}')" title="Close file">×</span>
        `;
        tab.onclick = () => loadFile(fileName);
        fileTabs.appendChild(tab);
      });

      // Add file button
      const addBtn = document.createElement('button');
      addBtn.className = 'add-file-btn';
      addBtn.innerHTML = '+';
      addBtn.title = 'New file';
      addBtn.onclick = createNewFile;
      fileTabs.appendChild(addBtn);
    }

    function loadFile(fileName) {
      if (files[fileName]) {
        currentFile = fileName;
        editor.value = files[fileName];
        updateLineNumbers();
        output.textContent = 'Run your code to see output...';
        output.classList.add('empty');
        renderTabs();
      }
    }

    function closeFile(fileName) {
      if (fileName === 'main.krx') {
        alert('Cannot close main.krx');
        return;
      }
      delete files[fileName];
      if (currentFile === fileName) {
        currentFile = 'main.krx';
        loadFile('main.krx');
      } else {
        renderTabs();
      }
    }

    function createNewFile() {
      customFileCount++;
      const newFileName = `file${customFileCount}.krx`;
      files[newFileName] = '# New file\nprint("Start coding here!")';
      loadFile(newFileName);
    }

    // Handle run button
    runButton.addEventListener('click', () => {
      output.classList.remove('empty');
      output.textContent = 'Output would appear here.\n(Kria WebAssembly runtime coming soon...)\n\nCode from ' + currentFile + ':\n' + editor.value;
    });

    // Handle tab indentation in editor
    editor.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.substring(0, start) + '\t' + editor.value.substring(end);
        editor.selectionStart = editor.selectionEnd = start + 1;
        updateLineNumbers();
      }
    });
  </script>
</body>
</html>
